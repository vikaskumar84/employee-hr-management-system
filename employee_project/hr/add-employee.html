<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Add Employee - HR Portal</title>
  <meta name="theme-color" content="#102a43">
  <link rel="stylesheet" href="../style.css?v=20260923">
</head>

<body>
  <div class="layout"><input class="nav-toggle" type="checkbox" id="nav-toggle" aria-label="Toggle navigation">
    <aside class="sidebar"><label class="sidebar-close" for="nav-toggle" aria-label="Close navigation">×</label>
      <div class="brand">HR Portal<small>Employee & HR Management System</small></div><a class="nav-link "
        href="dashboard.html">🏠<span>Dashboard</span></a><a class="nav-link " href="attendance.html">🕐<span>Attendance
          Management</span></a><a class="nav-link " href="leave.html">📝<span>Leave Management</span></a><a
        class="nav-link " href="profile.html">👤<span>Employee Profile</span></a><a class="nav-link "
        href="department.html">🏢<span>Department</span></a><a class="nav-link "
        href="payroll.html">💰<span>Payroll</span></a><a class="nav-link "
        href="announcements.html">📢<span>Announcements</span></a><a class="nav-link active"
        href="add-employee.html">➕<span>Add Employee</span></a><a class="nav-link logout"
        href="login.html">🚪<span>Logout</span></a>
    </aside><label class="nav-overlay" for="nav-toggle" aria-label="Close navigation"></label>
    <main class="main">
      <header class="topbar"><label class="menu-toggle" for="nav-toggle" aria-label="Open navigation">☰</label>
        <div class="user">
          <div><b>HR Admin</b>
            <div class="muted">HR Manager</div>
          </div>
          <div class="avatar hr-avatar" aria-label="HR Admin avatar">👨‍💼</div>
        </div>
      </header>
      <section class="content">
        <div class="hello">
          <h1>Add New Employee ➕</h1>
          <div class="muted">Register a new employee into the system database</div>
        </div>
        <div class="card" style="max-width:800px;margin:0 auto;">
          <form
            onsubmit="event.preventDefault(); alert('Employee added successfully! (Demo mode)'); window.location.href='profile.html';">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
              <div>
                <label style="display:block;font-weight:600;margin-bottom:6px;font-size:0.9rem;">Full Name</label>
                <input type="text" required placeholder="Enter full name"
                  style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;">
              </div>
              <div>
                <label style="display:block;font-weight:600;margin-bottom:6px;font-size:0.9rem;">Employee ID</label>
                <input type="text" required placeholder="e.g. VK-1026"
                  style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;">
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
              <div>
                <label style="display:block;font-weight:600;margin-bottom:6px;font-size:0.9rem;">Email Address</label>
                <input type="email" required placeholder="employee@company.com"
                  style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;">
              </div>
              <div>
                <label style="display:block;font-weight:600;margin-bottom:6px;font-size:0.9rem;">Phone Number</label>
                <input type="tel" required placeholder="+91 9876543210"
                  style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;">
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
              <div>
                <label style="display:block;font-weight:600;margin-bottom:6px;font-size:0.9rem;">Department</label>
                <select style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;">
                  <option>Computer Science</option>
                  <option>Software Development</option>
                  <option>Quality Assurance</option>
                  <option>Human Resources</option>
                  <option>Management</option>
                </select>
              </div>
              <div>
                <label style="display:block;font-weight:600;margin-bottom:6px;font-size:0.9rem;">Designation</label>
                <input type="text" required placeholder="e.g. Software Engineer"
                  style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;">
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
              <div>
                <label style="display:block;font-weight:600;margin-bottom:6px;font-size:0.9rem;">Employment Type</label>
                <select style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;">
                  <option>Full Time</option>
                  <option>Part Time</option>
                  <option>Contract</option>
                  <option>Intern</option>
                </select>
              </div>
              <div>
                <label style="display:block;font-weight:600;margin-bottom:6px;font-size:0.9rem;">Joining Date</label>
                <input type="date" required style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;">
              </div>
            </div>
            <div style="display:flex;gap:12px;justify-content:flex-end;">
              <a href="dashboard.html" class="btn btn-light"
                style="text-decoration:none;display:inline-flex;align-items:center;padding:10px 20px;border-radius:6px;background:#e2e8f0;color:#334155;font-weight:600;">Cancel</a>
              <button type="submit" class="btn btn-primary"
                style="padding:10px 24px;border-radius:6px;background:#102a43;color:#fff;border:none;font-weight:600;cursor:pointer;">Save
                Employee</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>
</body>

</html>
